<!--
M.I. Education Hub — Supabase authentication replacement

Use this to replace ONLY the existing authentication block and authentication
functions in your current index.html.

Important:
1. Put your Supabase Publishable key in the marked line.
2. Do NOT put a Supabase Secret/service_role key here.
3. This version uses Email + Password for Supabase Auth.
4. Phone is stored only as student profile information.
5. The old universal 2026 recovery code is removed.
-->

<!-- REPLACE the old authGate block with this -->
<div id="authGate" class="authGate">
  <div class="authBox">
    <h2>Welcome to M.I. Education Hub</h2>
    <p class="muted">Create an account or login before entering the Student website.</p>

    <div class="authTabs">
      <button onclick="showAuth('login')">Login</button>
      <button onclick="showAuth('register')">Registration</button>
      <button onclick="showAuth('reset')">Forgot Password</button>
    </div>

    <div id="authMsg"></div>

    <div id="loginForm">
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="email">

      <label>Password</label>
      <input id="loginPass" type="password" autocomplete="current-password">

      <button onclick="doLogin()">Login</button>
    </div>

    <div id="registerForm" class="hidden">
      <label>Name</label>
      <input id="regName" autocomplete="name">

      <label>School / College Name</label>
      <input id="regSchool" autocomplete="organization">

      <label>Phone Number</label>
      <input id="regPhone" inputmode="tel" autocomplete="tel">

      <label>Email</label>
      <input id="regEmail" type="email" autocomplete="email">

      <label>Password</label>
      <input id="regPass" type="password" autocomplete="new-password">

      <button onclick="doRegister()">Create Account</button>
    </div>

    <div id="resetForm" class="hidden">
      <p class="muted">
        Enter your registered email. Supabase will send a password-reset link.
      </p>

      <label>Email</label>
      <input id="resetEmail" type="email" autocomplete="email">

      <button onclick="doReset()">Send Reset Link</button>
    </div>
  </div>
</div>

<!-- Put this BEFORE your main authentication JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://fwptiluzthuzevrvfufg.supabase.co";

/* Paste ONLY your Supabase Publishable key here. */
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1JndUqwhkApW_oluorLI1g_0lttx5jn";
function esc(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
const supabaseClient =
  window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function setMsg(html) {
  document.getElementById("authMsg").innerHTML = html;
}
function esc(text) {
  return String(text).replace(/[&<>"']/g, function(c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    }[c];
  });
}
function showAuth(which) {
  ["loginForm", "registerForm", "resetForm"].forEach(id => {
    document.getElementById(id)
      .classList.toggle("hidden", id !== which + "Form");
  });
  setMsg("");
}

async function doRegister() {
  const name = regName.value.trim();
  const school = regSchool.value.trim();
  const phone = regPhone.value.trim();
  const email = regEmail.value.trim().toLowerCase();
  const pass = regPass.value;

  if (!name || !school || !phone || !email || !pass) {
    setMsg('<p class="err">Please fill in all fields.</p>');
    return;
  }

  if (pass.length < 6) {
    setMsg('<p class="err">Password must be at least 6 characters.</p>');
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: pass,
    options: {
      data: {
        name: name,
        school_college: school,
        phone: phone
      }
    }
  });

  if (error) {
    setMsg('<p class="err">' + esc(error.message) + '</p>');
    return;
  }

  if (!data.user) {
    setMsg('<p class="err">Registration could not be completed.</p>');
    return;
  }

  /*
    If email confirmation is disabled, save the profile immediately.
    If confirmation is enabled, the profile should be created by the
    Supabase database trigger that we will add in the next setup step.
  */
  if (data.session) {
    const { error: profileError } =
      await supabaseClient.from("student_profiles").insert({
        id: data.user.id,
        name: name,
        school_college: school,
        phone: phone
      });

    if (profileError) {
      setMsg(
        '<p class="err">Account created, but profile saving failed: ' +
        esc(profileError.message) + '</p>'
      );
      return;
    }

    document.getElementById("authGate").classList.add("hidden");
    return;
  }

  setMsg(
    '<p class="ok">Registration successful. Check your email for the confirmation link, then login.</p>'
  );
  showAuth("login");
  loginEmail.value = email;
}

async function doLogin() {
  const email = loginEmail.value.trim().toLowerCase();
  const pass = loginPass.value;

  if (!email || !pass) {
    setMsg('<p class="err">Enter your email and password.</p>');
    return;
  }

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: pass
    });

  if (error) {
    setMsg('<p class="err">' + esc(error.message) + '</p>');
    return;
  }

  document.getElementById("authGate").classList.add("hidden");
  setMsg("");
}

async function doReset() {
  const email = resetEmail.value.trim().toLowerCase();

  if (!email) {
    setMsg('<p class="err">Enter your registered email.</p>');
    return;
  }

  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin
    });

  if (error) {
    setMsg('<p class="err">' + esc(error.message) + '</p>');
    return;
  }

  setMsg(
    '<p class="ok">If the email is registered, a password-reset link has been sent.</p>'
  );
}

async function ensureAuth() {
  const { data } = await supabaseClient.auth.getSession();

  if (data.session) {
    document.getElementById("authGate").classList.add("hidden");
  } else {
    document.getElementById("authGate").classList.remove("hidden");
  }
}

supabaseClient.auth.onAuthStateChange((_event, session) => {
  if (session) {
    document.getElementById("authGate").classList.add("hidden");
  }
});

window.addEventListener("load", ensureAuth);
</script>
